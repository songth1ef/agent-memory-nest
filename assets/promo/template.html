<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1440px; }
body {
  font-family: -apple-system, system-ui, "SF Pro Display", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "kern";
  color: #000;
  background: #fafafc;
  position: relative;
  overflow: hidden;
}
/* long, very soft diagonal light streaks, as in the reference */
.s { position: absolute; border-radius: 50%; filter: blur(70px); transform-origin: center; }
.s1 { width: 1300px; height: 260px; left: -520px; top: 230px; background: #b7cffb; opacity: .72; transform: rotate(-22deg); }
.s2 { width: 1200px; height: 200px; left: -440px; top: 470px; background: #e6d8fb; opacity: .85; transform: rotate(-20deg); }
.s3 { width: 900px; height: 240px; left: -380px; top: 640px; background: #f6d9ef; opacity: .55; transform: rotate(-18deg); }
.s4 { width: 900px; height: 200px; left: 120px; top: 30px; background: #dde8fb; opacity: .5; transform: rotate(-18deg); }
.s5 { width: 1100px; height: 330px; right: -480px; top: 1010px; background: #c8daf8; opacity: .85; transform: rotate(-24deg); }
.s6 { width: 800px; height: 280px; left: -360px; bottom: -40px; background: #f8daef; opacity: .7; transform: rotate(-12deg); }

.wrap { position: absolute; inset: 0; padding: 96px 96px 96px; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: baseline; }
.brand { font-size: 34px; font-weight: 600; letter-spacing: -.3px; }
.page { font-size: 32px; color: rgba(60,60,67,.6); font-weight: 500; font-variant-numeric: tabular-nums; }

.main { margin-top: auto; }
.kicker { font-size: 34px; line-height: 1; color: rgba(60,60,67,.6); font-weight: 600; letter-spacing: .5px; }
h1 { margin-top: 28px; font-size: 128px; line-height: 1.1; font-weight: 700; letter-spacing: -1.5px; }
h1 .soft { color: rgba(60,60,67,.42); }
.body { margin-top: 56px; font-size: 46px; line-height: 1.45; color: rgba(60,60,67,.6); font-weight: 400; letter-spacing: -.2px; }
.body .lead { color: rgba(60,60,67,.6); }
.body .detail { margin-top: 16px; }
.body b { color: #000; font-weight: 600; }

.chips { margin-top: 72px; display: flex; gap: 16px; }
.chip {
  position: relative; overflow: hidden;
  border-radius: 999px; height: 96px; padding: 0 36px; display: flex; align-items: center;
  font-size: 38px; font-weight: 600; color: #000; letter-spacing: -.2px;
  background: linear-gradient(140deg, rgba(255,255,255,.95), rgba(255,255,255,.7));
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1.5px solid rgba(255,255,255,1);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,1), 0 10px 26px rgba(90,100,150,.08);
}
/* faint color caught inside each chip */
.chip::after { content: ""; position: absolute; width: 110px; height: 80px; border-radius: 50%; filter: blur(20px); }
.chip:nth-child(1)::after { left: -30px; top: -10px; background: #ffd3ef; opacity: .9; }
.chip:nth-child(2)::after { right: -30px; bottom: -40px; background: #ead9ff; opacity: .7; }
.chip:nth-child(3)::after { right: -10px; bottom: -45px; background: #d6e4ff; opacity: .8; }
.chip:nth-child(4)::after { right: -25px; bottom: -40px; background: #c7dbff; opacity: .9; }
.chip span { position: relative; z-index: 1; }

.foot { margin-top: 88px; display: flex; justify-content: space-between; align-items: center; }
.handle { font-size: 32px; color: rgba(60,60,67,.6); font-weight: 500; }
.dots { display: flex; gap: 12px; align-items: center; }
.dots i { width: 11px; height: 11px; border-radius: 6px; background: rgba(60,60,67,.18); }
.dots i.on { width: 36px; background: #000; }
</style>
</head>
<body>
<div class="s s4"></div><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div><div class="s s5"></div><div class="s s6"></div>
<div class="wrap">
  <div class="top">
    <div class="brand">github.com/songth1ef/agent-memory-nest</div>
    <div class="page">1 / 9</div>
  </div>

  <div class="main">
    <div class="kicker">半年实战分享</div>
    <h1><span class="soft">我用了半年的</span><br>AI 记忆系统</h1>
    <div class="body">
      <div class="lead">一个 git 仓库</div>
      <div class="detail">喂饱 <b>10 台机器</b>上的 <b>30+ 个 agent</b><br>换电脑、换厂商、被封号，记忆都不丢。</div>
    </div>
    <div class="chips">
      <div class="chip"><span>跨设备</span></div>
      <div class="chip"><span>跨厂商</span></div>
      <div class="chip"><span>记忆自持</span></div>
      <div class="chip"><span>开源</span></div>
    </div>
  </div>

  <div class="foot">
    <div class="handle">歌贼王 @songth1ef</div>
    <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</div>
</body>
</html>
